name: toolbox_vault
description: Offline all-in-one toolbox with QR tools, encrypted vault, passwords and notes.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  open_filex: ^4.5.0
  encrypt: ^5.0.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  flutter_animate: ^4.5.0

flutter:
  uses-material-design: true
