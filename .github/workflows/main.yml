name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --project-name toolbox_vault --org com.example .
      - name: Patch Android project
        run: |
          f=$(find android/app/src/main -name 'MainActivity.kt' | head -n 1)
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$f"
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <application android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          for s in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml; do
            if [ -f "$s" ]; then
              sed -i 's#@android:style/Theme.Light.NoTitleBar#Theme.AppCompat.Light.NoActionBar#g; s#@android:style/Theme.Black.NoTitleBar#Theme.AppCompat.NoActionBar#g' "$s"
            fi
          done
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*
      - name: Force compileSdk 36 for all plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              def ext = p.extensions.findByName('android')
              if (ext != null) {
                Integer cur = null
                try { cur = ext.compileSdk as Integer } catch (Throwable t) {}
                if (cur == null || cur < 36) {
                  try { ext.compileSdk = 36 } catch (Throwable t) { ext.compileSdkVersion(36) }
                }
              }
            }
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-vault-apk
          path: build/app/outputs/flutter-apk/app-release.apk
